name: Fetch wallpapers from Wallhaven

# The ONLY place images can be fetched from: the agent sandbox blocks
# wallhaven.cc, pinterest.com, danbooru and most image hosts, GitHub runners
# do not.
#
# Images land in this repo (volume 2) and are committed with plain git.
# wallpapers.json is NOT touched here - it lives in AniPix-Walls and is updated
# separately from staging/manifest.json.

on:
  schedule:
    - cron: "30 23 * * *"   # 05:00 IST
    - cron: "30 11 * * *"   # 17:00 IST
  workflow_dispatch:
    inputs:
      series:
        description: "Optional: comma-separated terms. Blank = use series.txt rotation."
        required: false
        default: ""
      per_series:
        description: "Max wallpapers per term"
        required: false
        default: "6"
      max_total:
        description: "Hard cap for the run"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests pillow

      - name: Guard - record file count before
        run: echo "BEFORE=$(git ls-files | wc -l)" >> "$GITHUB_ENV"

      - name: Pick the next series to fetch
        env:
          MANUAL: ${{ inputs.series }}
          BATCH: "10"
        run: |
          python - <<'PY'
          import json, os
          manual = (os.environ.get("MANUAL") or "").strip()
          batch = int(os.environ.get("BATCH", "10"))
          if manual:
              picked = [s.strip() for s in manual.split(",") if s.strip()]
              print("manual:", picked)
          else:
              all_series = [l.strip() for l in open("series.txt") if l.strip()]
              try:
                  done = set(json.load(open("state.json")))
              except Exception:
                  done = set()
              picked = [s for s in all_series if s not in done][:batch]
              if not picked:
                  print("all series already fetched - nothing to do")
              print("rotation:", picked)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SERIES_LIST=" + ",".join(picked) + "\n")
          PY

      - name: Fetch from Wallhaven
        if: env.SERIES_LIST != ''
        env:
          SERIES: ${{ env.SERIES_LIST }}
          PER_SERIES: ${{ inputs.per_series || '6' }}
          MAX_TOTAL: ${{ inputs.max_total || '60' }}
        run: python scripts/fetch_wallpapers.py

      - name: Place files in category folders
        if: env.SERIES_LIST != ''
        run: |
          python - <<'PY'
          import json, os, shutil
          try:
              m = json.load(open("staging/manifest.json"))
          except Exception:
              m = []
          if not m:
              print("nothing staged")
              raise SystemExit(0)
          cats = ["anime", "anime2"]
          for i, e in enumerate(m):
              cat = cats[i % 2]
              os.makedirs(cat, exist_ok=True)
              for suffix in ("", "_thumb"):
                  shutil.move(f"staging/{e['id']}{suffix}.webp", f"{cat}/{e['id']}{suffix}.webp")
              e["category"] = cat
          json.dump(m, open("staging/manifest.json", "w"), indent=1)
          print(f"placed {len(m)} wallpapers")
          PY

      - name: Update rotation state
        if: env.SERIES_LIST != '' && inputs.series == ''
        env:
          DONE: ${{ env.SERIES_LIST }}
        run: |
          python - <<'PY'
          import json, os
          try:
              done = json.load(open("state.json"))
          except Exception:
              done = []
          for s in os.environ["DONE"].split(","):
              s = s.strip()
              if s and s not in done:
                  done.append(s)
          json.dump(done, open("state.json", "w"), indent=1)
          print(f"rotation state: {len(done)} series done")
          PY

      - name: Commit and push
        run: |
          git config user.name "AniPix Fetcher"
          git config user.email "nobelfamily537@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          DEL=$(git status --short | grep -c '^ D' || true)
          ADD=$(git status --short | grep -c '^A' || true)
          echo "additions=$ADD deletions=$DEL"
          if [ "$DEL" -gt "$ADD" ]; then
            echo "::error::more deletions than additions - refusing to commit"
            exit 1
          fi
          git commit -m "Fetch from Wallhaven: $(git status --short | grep -c '^A') files"
          git push

      - name: Guard - file count must not drop
        run: |
          AFTER=$(git ls-files | wc -l)
          echo "before=$BEFORE after=$AFTER"
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::file count dropped from $BEFORE to $AFTER"
            exit 1
          fi
          echo "ok"
