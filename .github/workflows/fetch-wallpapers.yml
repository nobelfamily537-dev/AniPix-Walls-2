name: Fetch wallpapers from Wallhaven

# This is the ONLY place images can be fetched from. The agent sandbox blocks
# wallhaven.cc, pinterest.com, danbooru and most image hosts; GitHub runners
# have full internet.
#
# It stages images into this repo (volume 2) and commits them with plain git.
# It does NOT touch wallpapers.json - that index lives in AniPix-Walls and is
# updated by the caller from staging/manifest.json.

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Comma-separated search terms (e.g. frieren,dandadan,mashle)"
        required: true
      per_series:
        description: "Max wallpapers per term"
        required: false
        default: "8"
      max_total:
        description: "Hard cap for the run"
        required: false
        default: "120"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests pillow

      - name: Guard - record file count before
        run: echo "BEFORE=$(git ls-files | wc -l)" >> "$GITHUB_ENV"

      - name: Fetch from Wallhaven
        env:
          SERIES: ${{ inputs.series }}
          PER_SERIES: ${{ inputs.per_series }}
          MAX_TOTAL: ${{ inputs.max_total }}
        run: python scripts/fetch_wallpapers.py

      - name: Place files in category folders
        run: |
          python - <<'PY'
          import json, os, shutil
          m = json.load(open("staging/manifest.json"))
          if not m:
              print("nothing staged")
              raise SystemExit(0)
          cats = ["anime", "anime2"]
          for i, e in enumerate(m):
              cat = cats[i % 2]
              for suffix in ("", "_thumb"):
                  src = f"staging/{e['id']}{suffix}.webp"
                  dst = f"{cat}/{e['id']}{suffix}.webp"
                  os.makedirs(cat, exist_ok=True)
                  shutil.move(src, dst)
              e["category"] = cat
          json.dump(m, open("staging/manifest.json", "w"), indent=1)
          print(f"placed {len(m)} wallpapers")
          PY

      - name: Commit and push
        run: |
          git config user.name "AniPix Fetcher"
          git config user.email "nobelfamily537@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          DEL=$(git status --short | grep -c '^ D' || true)
          ADD=$(git status --short | grep -c '^A' || true)
          echo "additions=$ADD deletions=$DEL"
          if [ "$DEL" -gt "$ADD" ]; then
            echo "::error::more deletions than additions - refusing to commit"
            exit 1
          fi
          git commit -m "Fetch from Wallhaven: $(python -c "import json;print(len(json.load(open('staging/manifest.json'))))") wallpapers"
          git push

      - name: Guard - file count must not drop
        run: |
          AFTER=$(git ls-files | wc -l)
          echo "before=$BEFORE after=$AFTER"
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::file count dropped from $BEFORE to $AFTER"
            exit 1
          fi
          echo "ok"

      - name: Summary
        run: |
          python - <<'PY'
          import json
          try:
              m = json.load(open("staging/manifest.json"))
          except Exception:
              m = []
          print(f"staged {len(m)} wallpapers")
          for e in m[:40]:
              print(f"  {e['category']}/{e['id']}  {e['series']}  {e['res']}")
          PY
