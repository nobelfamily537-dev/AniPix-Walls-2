name: akira
on:
  push:
    paths:
      - "trigger/akira.txt"
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow pytesseract && sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: python scripts/akira.py
      - run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git status --short | head
          DEL=$(git status --porcelain | grep -c '^ D' || true); echo "deletions=$DEL"
          if [ "$DEL" != "0" ]; then echo ABORT; exit 1; fi
          git commit -m "Nightly add: akira (strict)" || echo none
          git push
